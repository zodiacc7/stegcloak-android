plugins {
    id 'com.android.application'
}

android {
    namespace 'com.stegcloak.android'
    compileSdk 34

    defaultConfig {
        // Package name stays English as required
        applicationId "com.stegcloak.android"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "1.1.1"
        // Keep both languages; don't let aapt strip translations
        resConfigs "en", "fa"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            // Re-use debug keystore so APK is installable (Play Store needs its own release key)
            signingConfig signingConfigs.debug
            minifyEnabled false
            debuggable false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // localeConfig is provided manually in res/xml/locales_config.xml
    // no auto-generation needed
}
