plugins {
    id 'com.android.application'
}

android {
    namespace 'com.stegcloak.android'
    compileSdk 33

    defaultConfig {
        applicationId "com.stegcloak.android"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
